name: Agent Knowledge Sync Check

on:
  pull_request:
    paths:
      - "backend/routes/**"
      - "data/**"
      - "tools/update_knowledge.py"
      - ".agent/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-agent-knowledge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate .agent autogenerated sections
        run: python tools/update_knowledge.py

      - name: Detect .agent changes
        id: detect_agent_changes
        run: |
          if git diff --quiet -- .agent/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-commit .agent updates to PR branch
        if: steps.detect_agent_changes.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(agent): refresh autogenerated knowledge docs"
          file_pattern: ".agent/*.md"

      - name: Warn for forked PRs (auto-push unavailable)
        if: steps.detect_agent_changes.outputs.changed == 'true' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true
        run: echo "::warning::.agent docs need refresh, but this PR is from a fork and cannot be auto-pushed."

      - name: Verify autogenerated .agent sections are up to date
        run: python tools/update_knowledge.py --check
