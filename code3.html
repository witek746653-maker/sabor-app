<!DOCTYPE html>
<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Wine List Generator</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#d41193",
                        "background-light": "#f8f6f7",
                        "background-dark": "#22101c",
                        "surface-dark": "#33192b",
                        "border-dark": "#673255",
                        "chip-bg": "#48233c",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>.no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="font-display bg-background-light dark:bg-background-dark text-slate-900 dark:text-white antialiased min-h-screen">
<div class="relative flex flex-col w-full max-w-md mx-auto min-h-screen overflow-hidden shadow-2xl bg-background-light dark:bg-background-dark">
<header class="flex items-center justify-between p-4 bg-background-light dark:bg-background-dark sticky top-0 z-20 border-b border-border-dark/30 backdrop-blur-md bg-opacity-90 dark:bg-opacity-90">
<button class="flex items-center justify-center size-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl dark:text-white">arrow_back</span>
</button>
<h1 class="text-lg font-bold tracking-tight">Wine List Generator</h1>
<button class="flex items-center justify-center size-10 rounded-full hover:bg-black/5 dark:hover:bg-white/10 transition-colors">
<span class="material-symbols-outlined text-2xl dark:text-white">more_vert</span>
</button>
</header>
<main class="flex-1 overflow-y-auto no-scrollbar pb-32">
<section class="p-4 space-y-5">
<h2 class="text-2xl font-bold px-1">Add New Wine</h2>
<div class="bg-surface-dark/50 dark:bg-surface-dark/30 rounded-2xl border border-border-dark p-4 space-y-5 shadow-lg">
<div class="flex gap-3">
<div class="space-y-2 flex-[3]">
<label class="text-sm font-medium text-white/80 ml-1">Wine Name</label>
<input class="w-full rounded-xl bg-surface-dark border-border-dark text-white placeholder-white/40 focus:ring-primary focus:border-primary p-4 text-base" placeholder="e.g. Château Margaux" type="text"/>
</div>
<div class="space-y-2 flex-1">
<label class="text-sm font-medium text-white/80 ml-1">Bottles</label>
<input class="w-full rounded-xl bg-surface-dark border-border-dark text-white placeholder-white/40 focus:ring-primary focus:border-primary p-4 text-base text-center" min="1" placeholder="1" type="number" value="1"/>
</div>
</div>
<div class="space-y-2">
<label class="text-sm font-medium text-white/80 ml-1">Country</label>
<div class="relative">
<select class="w-full appearance-none rounded-xl bg-surface-dark border-border-dark text-white p-4 pr-10 text-base focus:ring-primary focus:border-primary">
<option disabled="" selected="" value="">Select Country...</option>
<option value="fr">France</option>
<option value="it">Italy</option>
<option value="es">Spain</option>
<option value="us">USA</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-white/60 pointer-events-none">expand_more</span>
</div>
</div>
<div class="space-y-2">
<label class="text-sm font-medium text-white/80 ml-1">Type</label>
<div class="flex gap-3 overflow-x-auto no-scrollbar pb-2">
<button class="flex h-10 shrink-0 items-center gap-x-2 rounded-xl bg-primary px-4 shadow-lg shadow-primary/30 transition-all">
<span class="material-symbols-outlined text-[18px]">circle</span>
<span class="text-sm font-bold">Red</span>
</button>
<button class="flex h-10 shrink-0 items-center gap-x-2 rounded-xl bg-chip-bg px-4 hover:bg-chip-bg/80 transition-all border border-transparent hover:border-border-dark">
<span class="material-symbols-outlined text-[18px]">wine_bar</span>
<span class="text-sm font-medium">White</span>
</button>
<button class="flex h-10 shrink-0 items-center gap-x-2 rounded-xl bg-chip-bg px-4 hover:bg-chip-bg/80 transition-all border border-transparent hover:border-border-dark">
<span class="material-symbols-outlined text-[18px]">local_florist</span>
<span class="text-sm font-medium">Rose</span>
</button>
<button class="flex h-10 shrink-0 items-center gap-x-2 rounded-xl bg-chip-bg px-4 hover:bg-chip-bg/80 transition-all border border-transparent hover:border-border-dark">
<span class="material-symbols-outlined text-[18px]">shutter_speed</span>
<span class="text-sm font-medium">Sparkling</span>
</button>
</div>
</div>
<div class="space-y-2">
<label class="text-sm font-medium text-white/80 ml-1">Taste Profile</label>
<div class="flex flex-wrap gap-2">
<button class="rounded-lg bg-primary/20 border border-primary text-primary px-3 py-1.5 text-xs font-semibold">Dry</button>
<button class="rounded-lg bg-chip-bg border border-transparent text-white/70 px-3 py-1.5 text-xs font-medium hover:text-white hover:border-border-dark transition-colors">Sweet</button>
<button class="rounded-lg bg-chip-bg border border-transparent text-white/70 px-3 py-1.5 text-xs font-medium hover:text-white hover:border-border-dark transition-colors">Oaky</button>
<button class="rounded-lg bg-primary/20 border border-primary text-primary px-3 py-1.5 text-xs font-semibold">Fruity</button>
<button class="rounded-lg bg-chip-bg border border-transparent text-white/70 px-3 py-1.5 text-xs font-medium hover:text-white hover:border-border-dark transition-colors">Tannic</button>
<button class="rounded-lg bg-chip-bg border border-transparent text-white/70 px-3 py-1.5 text-xs font-medium hover:text-white hover:border-border-dark transition-colors">Light</button>
</div>
</div>
<div class="pt-2 flex flex-col gap-3">
<button class="w-full h-12 rounded-xl bg-primary text-white font-bold text-base shadow-lg shadow-primary/25 active:scale-[0.98] transition-transform flex items-center justify-center gap-2">
<span class="material-symbols-outlined">add</span>
                            Add to List
                        </button>
<button class="w-full h-10 rounded-xl text-white/60 font-medium text-sm hover:text-white transition-colors">
                            Clear Fields
                        </button>
</div>
</div>
</section>
<div class="h-px w-full bg-border-dark/50 my-2"></div>
<section class="p-4 space-y-4">
<div class="flex justify-between items-end px-1">
<h2 class="text-xl font-bold">Your Selection <span class="text-primary text-lg ml-1">(2)</span></h2>
</div>
<div class="group relative bg-surface-dark rounded-2xl p-4 border border-border-dark/50 hover:border-primary/50 transition-colors shadow-sm">
<div class="absolute right-3 top-3 flex gap-1">
<button class="p-1.5 rounded-lg text-white/50 hover:text-primary hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-lg">edit</span>
</button>
<button class="p-1.5 rounded-lg text-white/50 hover:text-red-400 hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-lg">delete</span>
</button>
</div>
<div class="flex flex-col gap-2">
<div class="pr-16">
<span class="inline-flex items-center gap-1.5 rounded-md bg-chip-bg px-2 py-0.5 text-xs font-medium text-pink-200 mb-1 border border-border-dark">
<span class="size-1.5 rounded-full bg-yellow-200"></span> White
                            </span>
<h3 class="text-lg font-bold text-white leading-tight">Chablis Grand Cru 'Les Clos' 2018</h3>
</div>
<div class="flex flex-wrap gap-y-1 gap-x-4 text-sm text-white/70 items-center mt-1">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-base text-primary">public</span>
<span>France, Burgundy</span>
</div>
</div>
<div class="flex items-center justify-between mt-3">
<div class="flex flex-wrap gap-2">
<span class="text-[10px] font-medium uppercase tracking-wider text-white/40 border border-white/10 rounded px-1.5 py-0.5">Dry</span>
<span class="text-[10px] font-medium uppercase tracking-wider text-white/40 border border-white/10 rounded px-1.5 py-0.5">Mineral</span>
</div>
<div class="flex items-center bg-chip-bg/50 border border-border-dark rounded-xl p-1 shrink-0">
<button class="size-8 flex items-center justify-center text-white/60 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-lg">remove</span>
</button>
<div class="px-3 min-w-[2.5rem] text-center">
<span class="text-sm font-bold text-white">4</span>
<span class="text-[9px] block text-white/40 -mt-1 uppercase">bottles</span>
</div>
<button class="size-8 flex items-center justify-center text-white/60 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-lg">add</span>
</button>
</div>
</div>
</div>
</div>
<div class="group relative bg-surface-dark rounded-2xl p-4 border border-border-dark/50 hover:border-primary/50 transition-colors shadow-sm">
<div class="absolute right-3 top-3 flex gap-1">
<button class="p-1.5 rounded-lg text-white/50 hover:text-primary hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-lg">edit</span>
</button>
<button class="p-1.5 rounded-lg text-white/50 hover:text-red-400 hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined text-lg">delete</span>
</button>
</div>
<div class="flex flex-col gap-2">
<div class="pr-16">
<span class="inline-flex items-center gap-1.5 rounded-md bg-chip-bg px-2 py-0.5 text-xs font-medium text-pink-200 mb-1 border border-border-dark">
<span class="size-1.5 rounded-full bg-red-500"></span> Red
                            </span>
<h3 class="text-lg font-bold text-white leading-tight">Barolo Cannubi 2016</h3>
</div>
<div class="flex flex-wrap gap-y-1 gap-x-4 text-sm text-white/70 items-center mt-1">
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-base text-primary">public</span>
<span>Italy, Piedmont</span>
</div>
</div>
<div class="flex items-center justify-between mt-3">
<div class="flex flex-wrap gap-2">
<span class="text-[10px] font-medium uppercase tracking-wider text-white/40 border border-white/10 rounded px-1.5 py-0.5">Tannic</span>
<span class="text-[10px] font-medium uppercase tracking-wider text-white/40 border border-white/10 rounded px-1.5 py-0.5">Complex</span>
</div>
<div class="flex items-center bg-chip-bg/50 border border-border-dark rounded-xl p-1 shrink-0">
<button class="size-8 flex items-center justify-center text-white/60 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-lg">remove</span>
</button>
<div class="px-3 min-w-[2.5rem] text-center">
<span class="text-sm font-bold text-white">2</span>
<span class="text-[9px] block text-white/40 -mt-1 uppercase">bottles</span>
</div>
<button class="size-8 flex items-center justify-center text-white/60 hover:text-primary transition-colors">
<span class="material-symbols-outlined text-lg">add</span>
</button>
</div>
</div>
</div>
</div>
</section>
</main>
<div class="fixed bottom-0 w-full max-w-md bg-[#22101c]/95 backdrop-blur-xl border-t border-border-dark/50 p-4 pb-8 z-30 shadow-[0_-10px_40px_-15px_rgba(0,0,0,0.5)]">
<div class="flex flex-col gap-4">
<div class="flex justify-between items-center px-1">
<h3 class="font-bold text-white">Export &amp; Share</h3>
<div class="flex bg-surface-dark rounded-lg p-1 border border-border-dark relative">
<button class="px-3 py-1 text-xs font-semibold rounded-md bg-primary text-white shadow-sm z-10 transition-all">Text</button>
<button class="px-3 py-1 text-xs font-medium text-white/60 hover:text-white z-10 transition-all">Image</button>
</div>
</div>
<div class="grid grid-cols-4 gap-3">
<button class="flex flex-col items-center gap-1.5 group">
<div class="size-12 rounded-2xl bg-surface-dark border border-border-dark flex items-center justify-center group-hover:bg-primary/20 group-hover:border-primary transition-all">
<span class="material-symbols-outlined text-blue-400">send</span>
</div>
<span class="text-[10px] font-medium text-white/70">Telegram</span>
</button>
<button class="flex flex-col items-center gap-1.5 group">
<div class="size-12 rounded-2xl bg-surface-dark border border-border-dark flex items-center justify-center group-hover:bg-primary/20 group-hover:border-primary transition-all">
<span class="material-symbols-outlined text-purple-400">image</span>
</div>
<span class="text-[10px] font-medium text-white/70">PNG</span>
</button>
<button class="flex flex-col items-center gap-1.5 group">
<div class="size-12 rounded-2xl bg-surface-dark border border-border-dark flex items-center justify-center group-hover:bg-primary/20 group-hover:border-primary transition-all">
<span class="material-symbols-outlined text-green-400">share</span>
</div>
<span class="text-[10px] font-medium text-white/70">Send</span>
</button>
<button class="flex flex-col items-center gap-1.5 group">
<div class="size-12 rounded-2xl bg-surface-dark border border-border-dark flex items-center justify-center group-hover:bg-primary/20 group-hover:border-primary transition-all">
<span class="material-symbols-outlined text-amber-400">content_copy</span>
</div>
<span class="text-[10px] font-medium text-white/70">Copy</span>
</button>
</div>
</div>
</div>
</div>
