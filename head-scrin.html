<!DOCTYPE html>

<html class="dark" lang="ru"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Выбор тренировки</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
        darkMode: "class",
        theme: {
            extend: {
                colors: {
                    "primary": "#19e66b",
                    "background-light": "#f6f8f7",
                    "background-dark": "#112117",
                    "surface-dark": "#1a2c22",
                },
                fontFamily: {
                    "display": ["Work Sans", "sans-serif"]
                },
                borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
            },
        },
    }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex flex-col antialiased selection:bg-primary/30">
<!-- Header -->
<div class="sticky top-0 z-50 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-md border-b border-black/5 dark:border-white/5">
<div class="flex items-center p-4 justify-between h-16">
<button class="text-black dark:text-white flex size-10 shrink-0 items-center justify-center rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h2 class="text-black dark:text-white text-lg font-bold leading-tight tracking-tight flex-1 text-center pr-10">Выбор тренировки</h2>
</div>
</div>
<!-- Main Content -->
<main class="flex-1 flex flex-col w-full max-w-md mx-auto pb-32">
<!-- Section 1: Menu Grid -->
<div class="pt-6 pb-2">
<div class="px-4 flex justify-between items-end mb-4">
<h3 class="text-black dark:text-white tracking-tight text-xl font-bold leading-tight">Меню</h3>
<span class="text-xs font-medium text-primary cursor-pointer hover:underline">Выбрать все</span>
</div>
<div class="grid grid-cols-2 gap-3 px-4">
<!-- Card 1: Active State -->
<div class="relative group cursor-pointer">
<div class="flex flex-col gap-3 p-4 bg-surface-dark dark:bg-[#1a2c22] border-2 border-primary rounded-xl transition-all duration-200 shadow-lg shadow-primary/10">
<div class="absolute top-3 right-3 size-5 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-background-dark text-[14px] font-bold">check</span>
</div>
<div class="size-10 rounded-lg bg-primary/20 flex items-center justify-center text-primary">
<span class="material-symbols-outlined">restaurant_menu</span>
</div>
<div>
<p class="text-black dark:text-white text-base font-bold leading-tight">Основное</p>
<p class="text-gray-500 dark:text-[#93c8a8] text-xs font-medium mt-1">Все блюда</p>
</div>
</div>
</div>
<!-- Card 2 -->
<div class="relative group cursor-pointer">
<div class="flex flex-col gap-3 p-4 bg-white dark:bg-[#1a2c22] border-2 border-transparent hover:border-primary/50 dark:hover:border-primary/50 rounded-xl transition-all duration-200 shadow-sm">
<div class="absolute top-3 right-3 size-5 rounded-full border border-gray-300 dark:border-gray-600"></div>
<div class="size-10 rounded-lg bg-gray-100 dark:bg-white/5 flex items-center justify-center text-gray-600 dark:text-gray-400">
<span class="material-symbols-outlined">bakery_dining</span>
</div>
<div>
<p class="text-black dark:text-white text-base font-bold leading-tight">Завтраки</p>
<p class="text-gray-500 dark:text-[#93c8a8] text-xs font-medium mt-1">Утреннее меню</p>
</div>
</div>
</div>
<!-- Card 3 -->
<div class="relative group cursor-pointer">
<div class="flex flex-col gap-3 p-4 bg-white dark:bg-[#1a2c22] border-2 border-transparent hover:border-primary/50 dark:hover:border-primary/50 rounded-xl transition-all duration-200 shadow-sm">
<div class="absolute top-3 right-3 size-5 rounded-full border border-gray-300 dark:border-gray-600"></div>
<div class="size-10 rounded-lg bg-gray-100 dark:bg-white/5 flex items-center justify-center text-gray-600 dark:text-gray-400">
<span class="material-symbols-outlined">wine_bar</span>
</div>
<div>
<p class="text-black dark:text-white text-base font-bold leading-tight">Винная карта</p>
<p class="text-gray-500 dark:text-[#93c8a8] text-xs font-medium mt-1">Вина и напитки</p>
</div>
</div>
</div>
<!-- Card 4 -->
<div class="relative group cursor-pointer">
<div class="flex flex-col gap-3 p-4 bg-white dark:bg-[#1a2c22] border-2 border-transparent hover:border-primary/50 dark:hover:border-primary/50 rounded-xl transition-all duration-200 shadow-sm">
<div class="absolute top-3 right-3 size-5 rounded-full border border-gray-300 dark:border-gray-600"></div>
<div class="size-10 rounded-lg bg-gray-100 dark:bg-white/5 flex items-center justify-center text-gray-600 dark:text-gray-400">
<span class="material-symbols-outlined">local_bar</span>
</div>
<div>
<p class="text-black dark:text-white text-base font-bold leading-tight">Бар</p>
<p class="text-gray-500 dark:text-[#93c8a8] text-xs font-medium mt-1">Коктейли</p>
</div>
</div>
</div>
</div>
</div>
<!-- Section 2: Chips -->
<div class="py-2">
<h3 class="text-black dark:text-white tracking-tight text-xl font-bold leading-tight px-4 pb-4 pt-2">Раздел меню</h3>
<div class="flex gap-3 px-4 overflow-x-auto no-scrollbar pb-2 snap-x">
<!-- Active Chip -->
<button class="snap-start shrink-0 flex h-9 items-center justify-center px-4 rounded-lg bg-primary text-background-dark font-semibold text-sm transition-transform active:scale-95">
                    Все
                </button>
<!-- Inactive Chips -->
<button class="snap-start shrink-0 flex h-9 items-center justify-center px-4 rounded-lg bg-white dark:bg-[#1a2c22] border border-gray-200 dark:border-white/5 text-gray-700 dark:text-white text-sm font-medium transition-all active:scale-95 hover:border-primary/50 dark:hover:border-primary/50">
                    Холодные закуски
                </button>
<button class="snap-start shrink-0 flex h-9 items-center justify-center px-4 rounded-lg bg-white dark:bg-[#1a2c22] border border-gray-200 dark:border-white/5 text-gray-700 dark:text-white text-sm font-medium transition-all active:scale-95 hover:border-primary/50 dark:hover:border-primary/50">
                    Супы
                </button>
<button class="snap-start shrink-0 flex h-9 items-center justify-center px-4 rounded-lg bg-white dark:bg-[#1a2c22] border border-gray-200 dark:border-white/5 text-gray-700 dark:text-white text-sm font-medium transition-all active:scale-95 hover:border-primary/50 dark:hover:border-primary/50">
                    Горячее
                </button>
<button class="snap-start shrink-0 flex h-9 items-center justify-center px-4 rounded-lg bg-white dark:bg-[#1a2c22] border border-gray-200 dark:border-white/5 text-gray-700 dark:text-white text-sm font-medium transition-all active:scale-95 hover:border-primary/50 dark:hover:border-primary/50">
                    Десерты
                </button>
</div>
</div>
<!-- Section 3: Training Mode -->
<div class="pt-4 pb-2">
<h3 class="text-black dark:text-white tracking-tight text-xl font-bold leading-tight px-4 pb-4">Режим тренировки</h3>
<div class="flex flex-col gap-3 px-4">
<!-- Mode 1 -->
<label class="relative flex items-center p-4 rounded-xl bg-white dark:bg-[#1a2c22] border border-gray-200 dark:border-white/5 cursor-pointer hover:border-primary/50 dark:hover:border-primary/50 transition-colors">
<input class="peer sr-only" name="mode" type="radio"/>
<div class="size-10 rounded-lg bg-orange-100 dark:bg-orange-500/20 text-orange-600 dark:text-orange-400 flex items-center justify-center mr-4">
<span class="material-symbols-outlined">translate</span>
</div>
<div class="flex-1">
<p class="text-black dark:text-white font-bold text-base">Английский</p>
<p class="text-gray-500 dark:text-[#93c8a8] text-xs mt-0.5">Перевод названий</p>
</div>
<div class="size-5 rounded-full border-2 border-gray-300 dark:border-gray-600 peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-background-dark text-[14px] font-bold opacity-0 peer-checked:opacity-100">check</span>
</div>
</label>
<!-- Mode 2 -->
<label class="relative flex items-center p-4 rounded-xl bg-surface-dark dark:bg-[#1a2c22] border-2 border-primary cursor-pointer shadow-lg shadow-primary/5">
<input checked="" class="peer sr-only" name="mode" type="radio"/>
<div class="size-10 rounded-lg bg-primary/20 text-primary flex items-center justify-center mr-4">
<span class="material-symbols-outlined">image</span>
</div>
<div class="flex-1">
<p class="text-black dark:text-white font-bold text-base">Картинки</p>
<p class="text-gray-500 dark:text-[#93c8a8] text-xs mt-0.5">Визуальное запоминание</p>
</div>
<div class="size-5 rounded-full bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-background-dark text-[14px] font-bold">check</span>
</div>
</label>
<!-- Mode 3 -->
<label class="relative flex items-center p-4 rounded-xl bg-white dark:bg-[#1a2c22] border border-gray-200 dark:border-white/5 cursor-pointer hover:border-primary/50 dark:hover:border-primary/50 transition-colors">
<input class="peer sr-only" name="mode" type="radio"/>
<div class="size-10 rounded-lg bg-blue-100 dark:bg-blue-500/20 text-blue-600 dark:text-blue-400 flex items-center justify-center mr-4">
<span class="material-symbols-outlined">grocery</span>
</div>
<div class="flex-1">
<p class="text-black dark:text-white font-bold text-base">Состав</p>
<p class="text-gray-500 dark:text-[#93c8a8] text-xs mt-0.5">Изучение ингредиентов</p>
</div>
<div class="size-5 rounded-full border-2 border-gray-300 dark:border-gray-600 peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-background-dark text-[14px] font-bold opacity-0 peer-checked:opacity-100">check</span>
</div>
</label>
<!-- Mode 4 -->
<label class="relative flex items-center p-4 rounded-xl bg-white dark:bg-[#1a2c22] border border-gray-200 dark:border-white/5 cursor-pointer hover:border-primary/50 dark:hover:border-primary/50 transition-colors">
<input class="peer sr-only" name="mode" type="radio"/>
<div class="size-10 rounded-lg bg-red-100 dark:bg-red-500/20 text-red-600 dark:text-red-400 flex items-center justify-center mr-4">
<span class="material-symbols-outlined">warning</span>
</div>
<div class="flex-1">
<p class="text-black dark:text-white font-bold text-base">Аллергены</p>
<p class="text-gray-500 dark:text-[#93c8a8] text-xs mt-0.5">Безопасность гостей</p>
</div>
<div class="size-5 rounded-full border-2 border-gray-300 dark:border-gray-600 peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center">
<span class="material-symbols-outlined text-background-dark text-[14px] font-bold opacity-0 peer-checked:opacity-100">check</span>
</div>
</label>
</div>
</div>
</main>
<!-- Bottom Sticky Controls -->
<div class="fixed bottom-0 left-0 w-full bg-background-light dark:bg-background-dark border-t border-black/5 dark:border-white/5 px-4 pt-4 pb-8 z-40 backdrop-blur-lg bg-opacity-95 dark:bg-opacity-95">
<div class="max-w-md mx-auto flex flex-col gap-4">
<!-- Segmented Control -->
<div class="flex flex-col gap-2">
<span class="text-xs uppercase tracking-wider text-gray-500 dark:text-gray-400 font-bold ml-1">Количество карточек</span>
<div class="flex bg-gray-200 dark:bg-[#1a2c22] p-1 rounded-xl">
<label class="flex-1 cursor-pointer">
<input checked="" class="peer sr-only" name="count" type="radio"/>
<div class="py-2.5 text-center text-sm font-bold rounded-lg text-black dark:text-white peer-checked:bg-primary peer-checked:text-background-dark transition-all">10</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="count" type="radio"/>
<div class="py-2.5 text-center text-sm font-bold rounded-lg text-gray-500 dark:text-gray-400 peer-checked:bg-primary peer-checked:text-background-dark transition-all">20</div>
</label>
<label class="flex-1 cursor-pointer">
<input class="peer sr-only" name="count" type="radio"/>
<div class="py-2.5 text-center text-sm font-bold rounded-lg text-gray-500 dark:text-gray-400 peer-checked:bg-primary peer-checked:text-background-dark transition-all">30</div>
</label>
</div>
</div>
<!-- CTA Button -->
<button class="w-full bg-primary hover:bg-primary/90 text-background-dark font-bold text-lg py-4 rounded-xl shadow-lg shadow-primary/25 transition-transform active:scale-[0.98] flex items-center justify-center gap-2">
<span class="material-symbols-outlined">play_arrow</span>
                Начать тренировку
            </button>
</div>
</div>
</body></html>
